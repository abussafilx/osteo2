# Netlify: site estático, sem build.
[build]
  publish = "public"

# Cabeçalhos de segurança em todo o site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Fontes: nunca mudam, cache de 1 ano
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens: 30 dias (se trocar uma imagem, mude-lhe o nome)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS e JS: 1 hora (e o ?v=N nos links força atualização quando mudar)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Evita conteúdo duplicado com /index.html
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
